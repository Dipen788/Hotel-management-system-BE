# Local dev stack for HotelChain DApp.
#
# Ganache is intentionally NOT dockerised — run it via the desktop GUI so you
# can inspect blocks/transactions visually. Set CHAIN_RPC_URL to the host's
# Ganache endpoint via host.docker.internal.
#
# Usage:
#   docker-compose up --build
#
# After first start, deploy the contract:
#   npx hardhat run scripts/deploy.js --network ganache
# (Writes frontend/src/utils/contractData.json; frontend hot-reloads.)

version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: hotel-dapp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: hotel-dapp-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/hotel-dapp
      JWT_SECRET: ${JWT_SECRET:-change-me-for-production-at-least-32-chars}
      CORS_ORIGIN: http://localhost:3000
      ENABLE_CHAIN_LISTENER: ${ENABLE_CHAIN_LISTENER:-false}
      CHAIN_RPC_URL: http://host.docker.internal:7545
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./frontend/src/utils/contractData.json:/app/contract-artifacts/contractData.json:ro
    # On Linux hosts, expose the Ganache port via host networking:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: hotel-dapp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  mongo-data:
    driver: local
